services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: kinetix-sqlserver
    restart: unless-stopped

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is required}"

    ports:
      - "1433:1433"

    volumes:
      - kinetix-sqlserver-data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" -b -o /dev/null"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

    networks:
      - kinetix-network

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: kinetix-api
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy
        restart: true

    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      ASPNETCORE_URLS: "http://+:8080"

      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=FitnessAppDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is required};TrustServerCertificate=True;MultipleActiveResultSets=True"

      JwtSettings__SecretKey: "${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}"
      JwtSettings__Issuer: "${JWT_ISSUER:-KinetixBackend}"
      JwtSettings__Audience: "${JWT_AUDIENCE:-KinetixClients}"

      SmtpSettings__Server: "${SMTP_SERVER:-smtp.gmail.com}"
      SmtpSettings__Port: "${SMTP_PORT:-587}"
      SmtpSettings__Username: "${SMTP_USERNAME:?SMTP_USERNAME is required}"
      SmtpSettings__Password: "${SMTP_PASSWORD:?SMTP_PASSWORD is required}"
      SmtpSettings__SenderEmail: "${SMTP_SENDER_EMAIL:?SMTP_SENDER_EMAIL is required}"
      SmtpSettings__SenderName: "${SMTP_SENDER_NAME:-Kinetix Platform}"

    ports:
      - "5068:8080"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent --max-time 4 http://localhost:8080/api/health > /dev/null || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

    networks:
      - kinetix-network

networks:
  kinetix-network:
    driver: bridge

volumes:
  kinetix-sqlserver-data:
    name: kinetix-sqlserver-data
